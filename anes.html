<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1216" media="(prefers-color-scheme: dark)">
<title>Vet Dose Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--ink:#11181f;--muted:#6b7682;--line:#e3e7eb;
  --accent:#0f766e;--accent-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1216;--surface:#161c22;--ink:#e9eef2;--muted:#8a97a3;--line:#242d36;
    --accent:#2dd4bf;--accent-ink:#04201c;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1216;--surface:#161c22;--ink:#e9eef2;--muted:#8a97a3;--line:#242d36;
  --accent:#2dd4bf;--accent-ink:#04201c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.4;
  -webkit-text-size-adjust:100%;
}
.app{width:100%;max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{
  position:sticky;top:0;z-index:5;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:var(--bg);border-bottom:1px solid var(--line);
}
.weight{display:flex;gap:8px;width:100%}
.step{
  flex:0 0 48px;height:52px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;font:inherit;font-size:1.4rem;cursor:pointer;
}
.step:active{opacity:.6}
.wfield{
  flex:1 1 auto;min-width:0;height:52px;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;
}
.wfield:focus-within{border-color:var(--accent)}
.wfield input{
  flex:1 1 auto;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;font-size:1.6rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;
}
.wfield span{flex:0 0 auto;color:var(--muted);font-weight:500}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
.chip{
  min-width:0;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:9px;font:inherit;font-size:.85rem;cursor:pointer;padding:0;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* list */
main{padding:4px 16px calc(env(safe-area-inset-bottom) + 24px)}
h2{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.row + .row{border-top:1px solid var(--line)}
.info{flex:1 1 auto;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{flex:0 0 auto;text-align:right;white-space:nowrap}
.out b{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.out small{display:block;font-size:.72rem;color:var(--muted);margin-top:-2px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="weight">
      <button class="step" type="button" data-step="-0.1" aria-label="ลด 0.1 kg">−</button>
      <label class="wfield">
        <input id="weight" type="text" inputmode="decimal" autocomplete="off" value="2" aria-label="น้ำหนัก kg">
        <span>kg</span>
      </label>
      <button class="step" type="button" data-step="0.1" aria-label="เพิ่ม 0.1 kg">+</button>
    </div>
    <div class="quick" id="quick"></div>
  </div>
  <main id="groups"></main>
</div>

<script>
const GROUPS = [
  {title:"Premedication", items:[
    {name:"Dexmedetomidine", conc:500, amt:"mcg", low:10, high:20, route:"IM"},
    {name:"Tramadol", conc:50, amt:"mg", low:3, high:3, route:"IM"}
  ]},
  {title:"Induction", items:[
    {name:"Propofol", conc:10, amt:"mg", low:1, high:2, route:"IV"}
  ]},
  {title:"Antibiotics", items:[
    {name:"Cefazolin", conc:200, amt:"mg", low:20, high:20, route:"IV"},
    {name:"Cefovecin", conc:80, amt:"mg", low:8, high:8, route:"SC"}
  ]},
  {title:"Post-op", items:[
    {name:"Meloxicam", conc:5, amt:"mg", low:0.3, high:0.3, route:"SC"}
  ]},
  {title:"Local block", items:[
    {name:"Lidocaine", conc:20, amt:"mg", low:1.5, high:1.5, route:"Intratesticular", perTestis:true}
  ]},
  {title:"Fluid", items:[
    {name:"Maintenance", rate:3, route:"IV", fluid:true}
  ]}
];
const QUICK = [1,2,3,4,5,6];
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; };
const trim = (n,d) => String(parseFloat(n.toFixed(d)));
const fv = v => !Number.isFinite(v) ? "—" : (v < 1 ? trim(v,3) : trim(v,2));
const outs = [];
let w = 2;

function build(){
  const q = $("#quick");
  QUICK.forEach(k => {
    const b = el("button","chip num",String(k)); b.type="button"; b.dataset.w=k;
    b.addEventListener("click",()=>setW(k)); q.appendChild(b);
  });
  const root = $("#groups");
  GROUPS.forEach(g => {
    root.appendChild(el("h2",null,g.title));
    const list = el("div","list");
    g.items.forEach(it => {
      const row = el("div","row");
      const info = el("div","info");
      info.appendChild(el("div","name",it.name));
      const dose = it.fluid ? `${it.rate} mL/kg/hr`
        : `${it.low===it.high ? it.low : it.low+"–"+it.high} ${it.amt}/kg · ${it.route}`;
      info.appendChild(el("div","sub num",dose));
      const out = el("div","out num");
      const b = el("b");
      out.append(b, el("small",null, it.fluid ? "mL/hr" : it.perTestis ? "mL/testis" : "mL"));
      row.append(info,out); list.appendChild(row);
      outs.push({it,b});
    });
    root.appendChild(list);
  });
}

function update(){
  const ok = Number.isFinite(w) && w > 0;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(ok && Number(c.dataset.w)===w)));
  outs.forEach(({it,b}) => {
    if (!ok){ b.textContent="—"; return; }
    if (it.fluid){ b.textContent = trim(w*it.rate,1); return; }
    const lo = w*it.low/it.conc, hi = w*it.high/it.conc;
    b.textContent = it.low===it.high ? fv(lo) : `${fv(lo)}–${fv(hi)}`;
  });
}
function setW(v){
  v = Math.min(100, Math.max(0.1, Math.round(v*10)/10));
  w = v; $("#weight").value = String(v); update();
}

build();
const inp = $("#weight");
inp.addEventListener("input", e => { w = parseFloat(e.target.value.replace(",",".")); update(); });
inp.addEventListener("focus", e => e.target.select());
inp.addEventListener("blur", () => { if (Number.isFinite(w) && w > 0) setW(w); });
document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => setW((Number.isFinite(w)?w:0) + Number(b.dataset.step))));
update();
</script>
</body>
</html>
