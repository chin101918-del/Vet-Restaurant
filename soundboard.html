<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ปุ่มเสียง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8f9;
    --ink: #1e2a32;
    --muted: #8a979f;
    --line: #e3e9ec;
    --accent: #3f948a;
    --accent-soft: #e2f1ef;
    --btn: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181c; --ink: #e8eef1; --muted: #75848d; --line: #212b31;
      --accent: #6cc4b8; --accent-soft: #1b2d2c; --btn: #182025; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: max(48px, env(safe-area-inset-top)) 20px max(48px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 420px; }
  .group { margin: 0; padding: 0; list-style: none; }
  .group + .group { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); }
  .row {
    position: relative; display: flex; align-items: center; gap: 18px;
    width: 100%; padding: 12px 0; background: none; border: 0; color: inherit;
    font: inherit; font-size: 1.125rem; text-align: left; cursor: pointer;
  }
  .dot {
    position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%;
    background: var(--btn); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--accent);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .dot svg { width: 18px; height: 18px; fill: currentColor; }
  .dot .stop { display: none; }
  .row:hover .dot { border-color: var(--accent); }
  .row:active .dot { transform: scale(.94); }
  .row:focus-visible { outline: none; }
  .row:focus-visible .dot { outline: 2px solid var(--accent); outline-offset: 3px; }
  .row.on .dot { background: var(--accent-soft); border-color: var(--accent); }
  .row.on .play { display: none; }
  .row.on .stop { display: block; }
  .row.on .label { font-weight: 500; }
  .ring { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); transform: rotate(-90deg); pointer-events: none; }
  .ring circle { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 150.8; stroke-dashoffset: 150.8; }
  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>
</head>

</main>

// ---------- Gentle synthesized chimes (soft sine bells, no sudden attack) ----------
let ctx;
const getCtx = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());

function bell(c, out, freq, t, gain, decay) {
  [[1, 1], [2, 0.18], [3, 0.05]].forEach(([mult, amp]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = freq * mult;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain * amp, t + 0.04);          // soft attack
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);       // long gentle fade
    o.connect(g).connect(out);
    o.start(t); o.stop(t + decay + 0.05);
  });
}

// notes: E5 A5 (rising, "heads up")  /  C6 G5 E5 C5 (falling, "all done")
const SYNTH = {
  warn: { name: "เหลือ 3 นาที", dur: 2.4,
    notes: [[659.25, 0], [880, 0.4], [1108.73, 0.8]], gain: 0.22, decay: 1.4 },
  done: { name: "หมดเวลา", dur: 3.6,
    notes: [[1046.5, 0], [783.99, 0.5], [659.25, 1.0], [523.25, 1.5]], gain: 0.2, decay: 1.8 },
};

function startSynth(key) {
  const c = getCtx(); c.resume();
  const s = SYNTH[key], out = c.createGain();
  out.gain.value = 0.9; out.connect(c.destination);
  const t0 = c.currentTime + 0.05;
  s.notes.forEach(([f, dt]) => bell(c, out, f, t0 + dt, s.gain, s.decay));
  return { duration: s.dur, pos: () => c.currentTime - t0,
    stop() { out.gain.cancelScheduledValues(c.currentTime); out.gain.setTargetAtTime(0, c.currentTime, 0.05); } };
}

// ---------- Decoding (Web Audio, works even where <audio> data: URIs are blocked) ----------
const cache = {};
function decoded(s) {
  return cache[s.id] ||= (async () => {
    const b64 = s.src.slice(s.src.indexOf(",") + 1);
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return await getCtx().decodeAudioData(bytes.buffer);
  })();
}
SOUNDS.forEach(s => decoded(s).catch(() => {}));

// ---------- Players ----------
const items = [
  { id: "warn", name: SYNTH.warn.name, start: () => startSynth("warn"), group: "timers" },
  { id: "done", name: SYNTH.done.name, start: () => startSynth("done"), group: "timers" },
  ...SOUNDS.map(s => ({ id: s.id, name: s.name, group: "songs", async start() {
    const c = getCtx(); c.resume();
    const buf = await decoded(s);
    const src = c.createBufferSource(), g = c.createGain();
    src.buffer = buf; g.gain.value = 1;
    src.connect(g).connect(c.destination);
    const t0 = c.currentTime + 0.02;
    src.start(t0);
    const h = { duration: buf.duration, pos: () => c.currentTime - t0, onend: null,
      stop() { src.onended = null; try { src.stop(); } catch (e) {} } };
    src.onended = () => h.onend && h.onend();
    return h;
  } })),
];

let current = null, raf = 0;
const C = 2 * Math.PI * 24;

function stopCurrent() {
  if (!current) return;
  cancelAnimationFrame(raf);
  current.handle.stop();
  current.row.classList.remove("on");
  current.ring.style.strokeDashoffset = C;
  current = null;
}

let token = 0;
async function toggle(item, row, ring) {
  const wasMe = current && current.row === row;
  stopCurrent();
  const my = ++token;
  if (wasMe) return;
  row.classList.add("on");
  let handle;
  try { handle = await item.start(); }
  catch (e) { console.error(e); row.classList.remove("on"); return; }
  if (my !== token) { handle.stop(); return; }
  current = { handle, row, ring };
  handle.onend = () => { if (current && current.handle === handle) stopCurrent(); };
  const tick = () => {
    if (!current || current.handle !== handle) return;
    const d = handle.duration, p = handle.pos();
    ring.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(p / d, 1)));
    if (p >= d + 0.05) return stopCurrent();
    raf = requestAnimationFrame(tick);
  };
  tick();
}

// ---------- Render ----------
for (const item of items) {
  const li = document.createElement("li");
  li.innerHTML = `
    <button class="row" type="button" aria-label="เล่นเสียง ${item.name}">
      <span class="dot">
        <svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/></svg>
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
      </span>
      <span class="label"></span>
    </button>`;
  li.querySelector(".label").textContent = item.name;
  const row = li.querySelector(".row"), ring = li.querySelector(".ring circle");
  ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C;
  row.addEventListener("click", () => toggle(item, row, ring));
  document.getElementById(item.group).appendChild(li);
}
</script>
