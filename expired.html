<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Session Expired</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* --- CSS Reset & Base --- */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Kanit', -apple-system, sans-serif;
      background: linear-gradient(135deg, #F2F2F7 0%, #E5E5EA 100%);
      color: #1D1D1F;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    /* --- Background Animation (Breathing) --- */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,140,0,0.05) 0%, transparent 60%);
      animation: breathe 8s ease-in-out infinite;
      z-index: -1;
    }

    /* --- Card Container (ขยายขนาด) --- */
    .card {
      background: rgba(255, 255, 255, 0.90); /* เพิ่มความทึบนิดหน่อยให้อ่านง่าย */
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 480px; /* ขยายความกว้างสูงสุด */
      padding: 60px 30px; /* เพิ่มพื้นที่แนวตั้ง */
      border-radius: 40px; /* เพิ่มความโค้งมน */
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.02),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* --- Icon Wrapper (ขยาย 1.5x) --- */
    .icon-wrapper {
      width: 130px; /* เดิม 88px */
      height: 130px;
      background: linear-gradient(135deg, #FFF5E6 0%, #FFE0B2 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 40px auto; /* เพิ่มระยะห่างด้านล่าง */
      box-shadow: 0 15px 30px rgba(255, 140, 0, 0.2);
      animation: iconPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
      transform: scale(0);
    }

    /* --- Icon SVG (ขยาย 1.5x) --- */
    .icon-svg {
      width: 64px; /* เดิม 42px */
      height: 64px;
      color: #FF8C00;
      stroke-width: 3; /* เพิ่มความหนาเส้นให้สมดุล */
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawLine 0.8s ease-out 0.7s forwards;
    }

    /* --- Typography (ขยาย Font) --- */
    h1 {
      font-size: 38px; /* เดิม 26px */
      font-weight: 600;
      margin: 0 0 15px 0;
      color: #1D1D1F;
      opacity: 0;
      line-height: 1.2;
      animation: textFadeIn 0.6s ease-out 0.5s forwards;
    }

    p {
      font-size: 22px; /* เดิม 16px */
      font-weight: 300;
      line-height: 1.6;
      color: #86868B;
      margin: 0;
      opacity: 0;
      animation: textFadeIn 0.6s ease-out 0.7s forwards;
    }

    .highlight {
      color: #FF8C00;
      font-weight: 500; /* เพิ่มน้ำหนักตัวหนานิดหน่อย */
    }

    /* --- Keyframe Animations --- */
    
    @keyframes cardEntrance {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes iconPop {
      to { transform: scale(1); }
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes textFadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    /* --- Responsive Adjustments for VERY small screens (iPhone SE) --- */
    @media (max-width: 360px) {
      .card { padding: 40px 20px; }
      h1 { font-size: 32px; }
      p { font-size: 18px; }
      .icon-wrapper { width: 100px; height: 100px; }
      .icon-svg { width: 50px; height: 50px; }
    }

  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrapper">
      <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
    </div>

    <h1>เซสชันหมดอายุ</h1>
    <p>
      กรุณา<span class="highlight">สแกน QR Code</span><br>
      ใหม่อีกครั้ง
    </p>
  </div>

</body>
</html>
