    this.el = document.createElement('div');
    this.el.className = 'screen';
  }
  Host.prototype.render = function () {
    var root = this.el;
    // keep focus + caret and unbound field values across re-renders
    var act = document.activeElement, focusKey = null, selS = null, selE = null;
    if (act && root.contains(act) && (act.tagName === 'INPUT' || act.tagName === 'TEXTAREA')) {
      focusKey = act.getAttribute('placeholder') || act.getAttribute('aria-label');
      try { selS = act.selectionStart; selE = act.selectionEnd; } catch (e) {}
    }
    var kept = {};
    root.querySelectorAll('input:not([data-bound]), textarea').forEach(function (f) {
      var k = f.getAttribute('placeholder') || f.getAttribute('aria-label'); if (k) kept[k] = f.value;
    });
    var scrolls = [];
    root.querySelectorAll('*').forEach(function (e) { if (e.scrollTop) scrolls.push([pathOf(e, root), e.scrollTop]); });

    var vals = this.inst.renderVals();
    var out = [];
    this.tpl.childNodes.forEach(function (c) { proc(c, vals, out); });
    root.textContent = '';
    out.forEach(function (k) { root.appendChild(k); });

    root.querySelectorAll('input:not([data-bound]), textarea').forEach(function (f) {
      var k = f.getAttribute('placeholder') || f.getAttribute('aria-label'); if (k && kept[k] != null) f.value = kept[k];
    });
    scrolls.forEach(function (s) { var e = byPath(s[0], root); if (e) e.scrollTop = s[1]; });
    if (focusKey) {
      var f = root.querySelector('[placeholder="' + focusKey + '"]') || root.querySelector('[aria-label="' + focusKey + '"]');
      if (f) { f.focus(); try { if (selS != null) f.setSelectionRange(selS, selE); } catch (e) {} }
    }
  };
  function pathOf(e, root) { var p = []; while (e && e !== root) { p.unshift(Array.prototype.indexOf.call(e.parentNode.children, e)); e = e.parentNode; } return p; }
  function byPath(p, root) { var e = root; for (var i = 0; i < p.length; i++) { e = e && e.children[p[i]]; } return e; }

  function show(name) {
    if (!SCREENS[name]) return;
    if (!cache[name]) { cache[name] = new Host(name); cache[name].render(); }
    if (current) stage.removeChild(current.el);
    current = cache[name];
    stage.appendChild(current.el);
    window.scrollTo(0, 0);
    var cur = current.el.querySelector('.nav [aria-current]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({block: 'nearest', inline: 'center'});
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  }
  stage.addEventListener('click', function (e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    var m = /^([\w-]+)\.dc\.html$/.exec(href);
    if (m) { e.preventDefault(); show(m[1]); }
    else if (href === '#') e.preventDefault();
  });
  window.addEventListener('hashchange', function () { var n = location.hash.slice(1); if (SCREENS[n] && (!current || current.name !== n)) show(n); });
  var start = location.hash.slice(1);
  show(SCREENS[start] ? start : 'Main');
})();
</script>
