<style>
body{margin:0}
a{color:#1E5B53;text-decoration:none}a:hover{color:#123F3A}
main > *{flex-shrink:0}

html,body{margin:0;background:#DDE5DF;font-family:'IBM Plex Sans Thai',sans-serif;color:#16231F}
.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px 40px;box-sizing:border-box}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px}

<script>
/* Vetbook launch splash (WebGL): the icon is a 3D model; it turns top-toward-camera while the book opens,
   the camera flies into the right page until it fills the screen, then the splash fades to reveal the app. */
window.__vbSplash=(function(){
var root=document.getElementById('vb-splash'), cvs=document.getElementById('vb-splash-canvas');
function done(){document.documentElement.classList.remove('vb-splash');if(root&&root.parentNode)root.parentNode.removeChild(root);}
var gl=cvs&&cvs.getContext&&(cvs.getContext('webgl',{antialias:true,alpha:false,depth:true,premultipliedAlpha:false,powerPreference:'high-performance'})||cvs.getContext('experimental-webgl',{antialias:true,alpha:false}));
if(!root||!gl){done();return {boot:function(f){f();}};}
try{
var DX=-6.06, OX=426.35, TOP=255.00, U=32.00, XE=951.76, PY=335.00, D=700;
var GS=1.0170, GX=-10.1, GY=-10.8;
function MX(x){return GX+GS*(x+DX)-627;} function MY(y){return 627-(GY+GS*y);}
var HX=MX(OX), HY=MY(TOP), YPT=MY(PY-16), XR=MX(XE+16);
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- geometry -> triangles (built once)
function sample(id,step){var p=document.getElementById('vbs-'+id),L=p.getTotalLength(),n=Math.max(12,Math.round(L/step)),raw=[],i;
  for(i=0;i<n;i++){var q=p.getPointAtLength(L*i/n);raw.push([MX(q.x),MY(q.y)]);}
  var out=[];for(i=0;i<raw.length;i++){var a=raw[(i-1+raw.length)%raw.length],b=raw[i],c=raw[(i+1)%raw.length];
    var cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]),l=Math.hypot(b[0]-a[0],b[1]-a[1])*Math.hypot(c[0]-b[0],c[1]-b[1])||1;
    if(Math.abs(cr)/l>0.004)out.push(b);}
  return out.length>8?out:raw;}
function area(P){var s=0;for(var i=0;i<P.length;i++){var j=(i+1)%P.length;s+=P[i][0]*P[j][1]-P[j][0]*P[i][1];}return s/2;}
function earcut(P){ // simple ear clipping for a simple polygon; returns index triples
  var idx=[],i;for(i=0;i<P.length;i++)idx.push(i); if(area(P)<0)idx.reverse();
  var tris=[],guard=0;
  function inside(p,a,b,c){function s(p1,p2,p3){return (p1[0]-p3[0])*(p2[1]-p3[1])-(p2[0]-p3[0])*(p1[1]-p3[1]);}
    var d1=s(p,a,b),d2=s(p,b,c),d3=s(p,c,a);return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));}
  while(idx.length>3&&guard++<20000){var ear=false;
    for(i=0;i<idx.length;i++){var ia=idx[(i-1+idx.length)%idx.length],ib=idx[i],ic=idx[(i+1)%idx.length],a=P[ia],b=P[ib],c=P[ic];
      if((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])<=1e-9)continue;
      var ok=true;for(var k=0;k<idx.length;k++){var ik=idx[k];if(ik===ia||ik===ib||ik===ic)continue;if(inside(P[ik],a,b,c)){ok=false;break;}}
      if(!ok)continue;tris.push(ia,ib,ic);idx.splice(i,1);ear=true;break;}
    if(!ear){idx.splice(0,1);} }
  if(idx.length===3)tris.push(idx[0],idx[1],idx[2]);
  return tris;}
var V=[]; // x,y,z,part,paper
function tri(a,b,c,part,paper){V.push(a[0],a[1],a[2],part,paper,b[0],b[1],b[2],part,paper,c[0],c[1],c[2],part,paper);}
function prism(P,z0,z1,part,paper){var t=earcut(P),i;
  for(i=0;i<t.length;i+=3){var a=P[t[i]],b=P[t[i+1]],c=P[t[i+2]];
    tri([a[0],a[1],z0],[b[0],b[1],z0],[c[0],c[1],z0],part,paper);tri([a[0],a[1],z1],[b[0],b[1],z1],[c[0],c[1],z1],part,paper);}
  for(i=0;i<P.length;i++){var p=P[i],q=P[(i+1)%P.length];
    tri([p[0],p[1],z0],[q[0],q[1],z0],[q[0],q[1],z1],part,paper);tri([p[0],p[1],z0],[q[0],q[1],z1],[p[0],p[1],z1],part,paper);}}
prism(sample('pBody',8),0,-D,0,0);
prism(sample('pPage',10),-12,-D+12,0,1);
for(var s=0;s<3;s++)prism([[HX,YPT],[XR-6-s*6,YPT],[XR-6-s*6,YPT+2.5],[HX,YPT+2.5]],-16-s*4,-D+16+s*4,2+s,1);
prism(sample('pLid',10),0,-D,1,0);
var nVert=V.length/5;
// ---------- GL program
function sh(type,src){var o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
var prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,
 'attribute vec3 aPos;attribute float aPart;attribute float aPaper;'+
 'uniform float uRot,uCover,uCam,uS,uD;uniform vec3 uSheet,uSheetHy;uniform vec2 uHinge,uT,uRes;varying float vPaper;'+
 'vec2 rz(vec2 p,vec2 c,float a){p-=c;float s=sin(a),k=cos(a);return c+vec2(p.x*k-p.y*s,p.x*s+p.y*k);}'+
 'void main(){vec3 p=aPos;'+
 ' if(aPart>0.5&&aPart<1.5)p.xy=rz(p.xy,uHinge,uCover);'+
 ' else if(aPart>1.5){float k=aPart-2.0;float an=k<0.5?uSheet.x:(k<1.5?uSheet.y:uSheet.z);float hy=k<0.5?uSheetHy.x:(k<1.5?uSheetHy.y:uSheetHy.z);p.xy=rz(p.xy,vec2(uHinge.x,hy),an);}'+
 ' float zc=p.z+uD*0.5;float c=cos(uRot),s=sin(uRot);'+
 ' vec3 q=vec3(p.x+uT.x,p.y*c-zc*s+uT.y,p.y*s+zc*c);'+
 ' float f=uCam/(uCam-q.z);vec2 scr=q.xy*uS*f;'+
 ' gl_Position=vec4(scr/(uRes*0.5),-q.z/4000.0,1.0);vPaper=aPaper;}'));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,
 'precision mediump float;uniform float uPaper;uniform vec3 uPaperCol;varying float vPaper;'+
 'void main(){gl_FragColor=vec4(mix(vec3(1.0),uPaperCol,uPaper*vPaper),1.0);}'));
gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(V),gl.STATIC_DRAW);
function attr(n,size,off){var l=gl.getAttribLocation(prog,n);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,size,gl.FLOAT,false,20,off);}
attr('aPos',3,0);attr('aPart',1,12);attr('aPaper',1,16);
var u={};['uRot','uCover','uCam','uS','uD','uSheet','uSheetHy','uHinge','uT','uRes','uPaper','uPaperCol'].forEach(function(n){u[n]=gl.getUniformLocation(prog,n);});
gl.uniform1f(u.uD,D);gl.uniform2f(u.uHinge,HX,HY);
gl.uniform3f(u.uSheetHy,(YPT+HY+U+8)/2,(YPT+HY+U+14)/2,(YPT+HY+U+20)/2);
gl.uniform3f(u.uPaperCol,243/255,245/255,241/255);
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(18/255,63/255,58/255,1);
// ---------- sizing
var W,H,DPR;
function resize(){DPR=Math.min(typeof MAXDPR==='number'?MAXDPR:3,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);gl.viewport(0,0,cvs.width,cvs.height);gl.uniform2f(u.uRes,W,H);}
// ---------- timeline
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}
function io(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function sine(t){return -(Math.cos(Math.PI*t)-1)/2;}
function quart(t){return 1-Math.pow(1-t,4);}
var END=2.5;
function frame(t){
  var pr=sine(seg(t,.6,2.0)), kk=Math.sin(Math.PI*pr);
  var S0=Math.min(W,H*0.6)*0.44/1254, SEND=Math.max(H*1.04/(D-24),W*1.04/(XR-HX));
  var z=io(seg(t,.6,END));                                  // one continuous fly-in to the right page
  gl.uniform1f(u.uRot,pr*Math.PI/2);
  gl.uniform1f(u.uCover,quart(seg(t,.75,1.75))*Math.PI);
  gl.uniform3f(u.uSheet,quart(seg(t,.95,1.85))*Math.PI*.978,quart(seg(t,1.07,1.97))*Math.PI*.984,quart(seg(t,1.19,2.09))*Math.PI*.99);
  gl.uniform1f(u.uCam,60000*(1-kk)+4200*kk);
  gl.uniform1f(u.uS,S0*Math.pow(SEND/S0,z));
  gl.uniform2f(u.uT,-(HX+XR)/2*z,0);
  gl.uniform1f(u.uPaper,seg(t,2.0,2.45));
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,nVert);
}
resize();frame(0);
var bornAt=performance.now(), motionAt=0, booted=false, finished=false, raf=0;
var FPS=/[?&]fps\b/.test(location.search), ft=[], lastNow=0;
function report(){if(!FPS||ft.length<5)return;var s=ft.slice().sort(function(a,b){return a-b}),med=s[s.length>>1],late=ft.filter(function(x){return x>med*1.5}).length;
  var d=document.createElement('div');d.textContent='splash (WebGL): '+ft.length+' frames · median '+med.toFixed(1)+' ms ('+Math.round(1000/med)+' fps) · late '+late;
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:2147483647;background:#16231F;color:#fff;font:13px/1.4 system-ui;padding:8px 10px;border-radius:10px';
  document.body.appendChild(d);setTimeout(function(){d.remove();},8000);}
function finish(){if(finished)return;finished=true;cancelAnimationFrame(raf);report();
  // the last splash frame is a full-screen page in the app's paper colour: match the page background,
  // drop the splash in the same frame (no visible change), then let the app fade up from the paper.
  var h=document.documentElement;h.classList.add('vb-reveal');h.classList.remove('vb-splash');
  if(root&&root.parentNode)root.parentNode.removeChild(root);
  setTimeout(function(){h.classList.remove('vb-reveal');},1000);}
var slow=0, MAXDPR=3;
function tick(now){
  if(motionAt&&lastNow){var dt=now-lastNow;ft.push(dt);slow=dt>24?slow+1:0;
    if(slow>=3&&MAXDPR>2){MAXDPR=2;resize();}}               // device struggling: render at 2x instead of 3x
  lastNow=now;
  var t=motionAt?.6+(now-motionAt)/1000:.6;
  frame(Math.min(t,END));
  if(t>=END){finish();return;}
  raf=requestAnimationFrame(tick);
}
window.__vbSplashSeek=function(t){frame(t);};
window.__vbSplashInfo=function(){return {verts:nVert,dpr:DPR};};
window.addEventListener('resize',function(){resize();});
root.addEventListener('click',function(){if(booted)finish();});
setTimeout(function(){if(!booted)done();},6000);
return {boot:function(app){
  requestAnimationFrame(function(){setTimeout(function(){
    try{app();}catch(e){console.error(e);}
    booted=true;
    if(window.__vbSplashHold)return;              // test hook: keep the splash for frame-by-frame checks
    if(reduce){setTimeout(finish,250);return;}
    motionAt=Math.max(performance.now(),bornAt+450);
    raf=requestAnimationFrame(tick);
  },0);});
}};
}catch(e){console.error(e);done();return {boot:function(f){f();}};}
})();
</script>

 ];\n    var round = this.state.round;\n    var cur = data.filter(function (r) { return r.id === round; })[0];\n    var rounds = data.map(function (r) {\n      var on = r.id === round;\n      return {\n        date: r.date, unit: r.unit, time: r.time, hrs: r.hrs, today: !!r.today, on: on ? 'true' : 'false',\n        pick: function () { self.setState({ round: r.id, skills: {} }); },\n        tagStyle: 'font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: #F2B544; color: #16231F',\n        metaStyle: 'font-size: 12px; font-variant-numeric: tabular-nums; ' + (on ? 'color: #5B6B66' : 'color: #CFE3DC'),\n        style: 'flex: 0 0 auto; width: 168px; min-height: 100px; justify-content: flex-start; padding: 10px 12px; border-radius: 14px; font-family: inherit; text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; cursor: pointer; box-sizing: border-box; ' + (on ? 'border: 2px solid #F2B544; background: #FFFFFF; color: #16231F; box-shadow: 0 6px 16px rgba(0,0,0,0.25)' : 'border: 2px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #FFFFFF')\n      };\n    });\n    var species = [{ id: 'dog', label: 'สุนัข' }, { id: 'cat', label: 'แมว' }].map(function (sp) {\n      var on = !!self.state.species[sp.id];\n      return {\n        label: sp.label, on: on ? 'true' : 'false',\n        toggle: function () {\n          var next = Object.assign({}, self.state.species);\n          next[sp.id] = !next[sp.id];\n          self.setState({ species: next });\n        },\n        style: 'height: 40px; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'border: 0; background: #1E5B53; color: #FFFFFF; font-weight: 600' : 'border: 1px solid #E2E7E1; background: #FFFFFF; color: #16231F')\n      };\n    });\n    var sel = this.state.skills;\n    var picked = 0;\n    var skills = cur.skills.map(function (s) {\n      var on = !!sel[s.id];\n      if (on) picked++;\n      return {\n        name: s.name, on: on ? 'true' : 'false',\n        box: 'width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; ' + (on ? 'background: #1E5B53; border: 0' : 'background: #FFFFFF; border: 1.5px solid #9AAAA4'),\n        toggle: function () {\n          var next = Object.assign({}, self.state.skills);\n          next[s.id] = !next[s.id];\n          self.setState({ skills: next });\n        }\n      };\n    });\n\n    var code = (this.state.code || '').trim().toUpperCase();\n    var match = data.filter(function (r) { return r.code === code; })[0] || null;\n    var codeErr = this.state.tried && code.length > 0 && !match;\n    var recent = data.slice(0, 3).map(function (r) {\n      return { code: r.code, short: r.date, fill: function () { self.setState({ code: r.code, tried: false }); } };\n    });\n    var ready = !!match;\n    return {\n      rounds: rounds, species: species, skills: skills, picked: picked, skillCount: cur.skills.length,\n      cur: {\n        unit: cur.unit, code: cur.code, date: cur.date, time: cur.time, hrs: cur.hrs,\n        tag: cur.today ? 'เช็กอินแล้ว' : 'รอบที่ลงไว้',\n        tagStyle: 'font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 8px; white-space: nowrap; flex: 0 0 auto; ' + (cur.today ? 'color: #16231F; background: #F2B544' : 'color: #FFFFFF; background: rgba(255,255,255,0.16)')\n      },\n      showCode: this.state.sheet,\n      openCode: function () { self.setState({ sheet: true, code: '', tried: false }); },\n      closeCode: function () { self.setState({ sheet: false }); },\n      code: this.state.code,\n      onCode: function (ev) { self.setState({ code: ev.target.value, tried: false }); },\n      codeInput: 'height: 56px; border-radius: 14px; padding: 0 16px; font-family: inherit; font-size: 20px; font-weight: 600; letter-spacing: 1.5px; color: #16231F; outline: none; text-transform: uppercase; ' + (codeErr skills}}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; align-items: center; gap: 10px; min-height: 42px; border-bottom: 1px solid #EEF1EC\">\n              <span style=\"width: 22px; height: 22px; border-radius: 50%; background: #DCEBE5; display: flex; align-items: center; justify-content: center; flex: 0 0 auto\">\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E5B53\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"/><\/svg>\n              <\/span>\n              <span style=\"font-size: 14px\">{{s}}<\/span>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n\n      <section style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; flex-direction: column; gap: 2px\">\n          <h2 style=\"margin: 0; font-size: 14px; font-weight: 600\">4. Feedback แลปนี้ <span style=\"font-weight: 400; color: #5B6B66\">(ไม่บังคับ)<\/span><\/h2>\n          <span style=\"font-size: 12px; color: #5B6B66\">ส่งถึงอาจารย์ผู้รับผิดชอบแลป<\/span>\n        <\/div>\n        <label style=\"display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 13px; font-weight: 500\">ปัญหาที่พบ<\/span>\n          <textarea rows=\"3\" placeholder=\"เช่น อุปกรณ์ไม่พอ ยาสลบออกฤทธิ์ช้า เวลาไม่พอ\" style=\"border-radius: 12px; border: 1px solid #C9D3CC; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 15px; color: #16231F; resize: none; outline: none\"><\/textarea>\n        <\/label>\n        <label style=\"display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 13px; font-weight: 500\">ข้อเสนอแนะ<\/span>\n          <textarea rows=\"3\" placeholder=\"สิ่งที่อยากให้ปรับในแลปครั้งถัดไป\" style=\"border-radius: 12px; border: 1px solid #C9D3CC; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 15px; color: #16231F; resize: none; outline: none\"><\/textarea>\n        <\/label>\n      <\/section>\n    <\/main>\n\n    <div style=\"flex: 0 0 auto; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E2E7E1\">\n      <button style=\"width: 100%; height: 52px; border-radius: 14px; border: 0; background: #1E5B53; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer\">ยืนยันบันทึก · {{roleName}} · {{animalName}}<\/button>\n    <\/div>\n  <\/sc-if>\n<\/div>","code":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { view: props.view ?? 'pick', role: 'surg', animal: 'df' };\n  }\n  componentDidUpdate(prev) {\n    if (prev.view !== this.props.view) this.setState({ view: this.props.view ?? 'pick' });\n  }\n  renderVals() {\n    var self = this;\n    var drug = ['Pre-anesthetic exam', 'คำนวณขนาดยา (Dose calculation)', 'Premedication', 'IV catheter placement', 'Induction'];\n    var monitor = ['Endotracheal intubation', 'Anesthesia monitoring (HR, RR, SpO₂, BP)', 'บันทึก Anesthetic record', 'Recovery monitoring'];\n    var roleDefs = [\n      { id: 'surg', name: 'Surgeon', sw: 1.6, d: 'M9.15 13.3V12.3L19.3 2A1.78 1.78 0 0 1 21.8 4.5L11.7 14.7H10.6L9.9 15.4C9.3 16 9.3 16.4 9.3 16.9C9.3 17.3 9.1 17.6 8.9 17.9C6.8 20.6 4.3 22.7 1.3 22.7C2.3 20.9 3.4 19.3 4.6 17.9Z', skills: ['Surgical scrub', 'Gowning & gloving', 'Ovariohysterectomy / Castration', 'Suture pattern', 'Suture knotting'] },\n      { id: 'asst', name: 'Assistant', d: 'M9 6a3 3 0 1 1-6 0a3 3 0 1 1 6 0ZM9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0ZM8.5 7.5 20 18M8.5 16.5 20 6', skills: ['Surgical scrub', 'Gowning & gloving', 'Instrument handling', 'Tissue retraction'] },\n      { id: 'anesD', name: 'Anesthetist drug', d: 'M14 6l4 4-9 9-4-4ZM7 17l-4 4M16 8l3-3M17.5 3.5l3 3M11 9l1.5 1.5M8 12l1.5 1.5', skills: drug },\n      { id: 'anesM', name: 'Anesthetist monitor', d: 'M3 4h18v12H3ZM8 20h8M12 16v4M6 10h3l1.5-3 3 6 1.5-3h r: 1px solid #E2E7E1; background: #FFFFFF; color: #16231F')\n      };\n    });\n    var pill = function (bg, fg) { return 'align-self: flex-start; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: ' + bg + '; color: ' + fg; };\n    var upcoming = [\n      { mon: 'ต.ค.', day: '27', title: 'แลปทำหมันสุนัขและแมว', code: 'LAB-SP05', time: '13.00–16.00', opens: 'เปิด 27 ต.ค.' },\n      { mon: 'พ.ย.', day: '10', title: 'แลปทำหมันสุนัขและแมว', code: 'LAB-SP06', time: '13.00–16.00', opens: 'เปิด 10 พ.ย.' }\n    ];\n    var past = [\n      { mon: 'ก.ย.', day: '22', title: 'แลปทำหมันสุนัขและแมว', code: 'LAB-SP03', detail: 'Surgeon · แมว เพศผู้', status: 'บันทึกแล้ว', badge: pill('#DCEBE5', '#123F3A') },\n      { mon: 'ก.ย.', day: '8', title: 'แลปทำหมันสุนัขและแมว', code: 'LAB-SP02', detail: 'Surgeon · สุนัข เพศเมีย', status: 'บันทึกแล้ว', badge: pill('#DCEBE5', '#123F3A') },\n      { mon: 'ส.ค.', day: '25', title: 'แลปทำหมันสุนัขและแมว', code: 'LAB-SP01', detail: 'ไม่ได้บันทึก', status: 'หมดเวลาบันทึก', badge: pill('#F6E1DC', '#8A2E20') }\n    ];\n    var view = this.state.view;\n    return {\n      isPick: view !== 'log', isLog: view === 'log',\n      goLog: function () { self.setState({ view: 'log' }); },\n      goPick: function () { self.setState({ view: 'pick' }); },\n      upcoming: upcoming, past: past,\n      roles: roles, animals: animals, skills: cur.skills, skillCount: cur.skills.length, roleName: cur.name, animalName: curA.label\n    };\n  }\n}\n","props":{"view":"pick"}},"Me.dc.html":{"label":"ฉัน","tpl":"<div style=\"width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F5F1; font-family: 'IBM Plex Sans Thai', sans-serif; color: #16231F; box-sizing: border-box; display: flex; flex-direction: column\">\n  <header style=\"padding: 20px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E7E1; display: flex; flex-direction: column; gap: 12px; flex: 0 0 auto\">\n    <h1 style=\"margin: 0; font-f
