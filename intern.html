<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#1E5B53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>VetKU · ฝึกงานและบันทึกทักษะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#F3F5F1}
body{font-family:'IBM Plex Sans Thai',sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:#1E5B53;text-decoration:none}a:hover{color:#123F3A}
/* phone: the app is exactly the visible screen */
#stage{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#F3F5F1}
.screen{width:100%;height:100%}
.screen [style*="overflow-y: auto"],.screen [style*="overflow-x: auto"]{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.screen ::-webkit-scrollbar{display:none}
.screen [style*="overflow-y: auto"] > *{flex-shrink:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #F2B544;outline-offset:2px}
/* stop iOS zooming in when a field is focused */
@media (hover:none) and (pointer:coarse){input,textarea{font-size:16px !important}}
/* small phones (≤360px): tighten a little so nothing overflows */
@media (max-width:360px){.screen{font-size:14px}.screen h1{font-size:21px !important}.screen header button,.screen header a{font-size:13px !important}}
/* desktop / tablet: show it inside a phone frame */
@media (min-width:600px){
  html,body{background:#DDE3DE}
  #stage{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:390px;height:min(844px,calc(100vh - 40px));border-radius:36px;box-shadow:0 24px 60px rgba(18,35,31,.25)}
}
</style>
</head>
<body>
<div id="stage"></div>

<template id="tpl-Main">
<div style="width: 100%; height: 100%; position: relative; overflow: hidden; background: #F3F5F1; font-family: 'IBM Plex Sans Thai', sans-serif; color: #16231F; box-sizing: border-box; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow-y: auto">
  <header style="background: #1E5B53; color: #FFFFFF; padding: 20px 16px 64px; display: flex; align-items: center; gap: 10px">
    <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23DCEBE5'/%3E%3Ccircle cx='32' cy='25' r='11' fill='%237FBFB2'/%3E%3Cpath d='M12 60c3-12 11-18 20-18s17 6 20 18z' fill='%237FBFB2'/%3E%3C/svg%3E" alt="ชินวร มาลีพัตร" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: center 20%; border: 2px solid #DCEBE5">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 600; white-space: nowrap">สวัสดี ชินวร</span>
      <span style="font-size: 12px; color: #CFE3DC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ชั้นปีที่ 4 · สัตวแพทยศาสตร์ ม.เกษตรศาสตร์</span>
    </div>
    <button onClick="{{openNotif}}" aria-label="{{bellLabel}}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #2A6F66; color: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}">
        <span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #F2B544; color: #16231F; border: 2px solid #1E5B53; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{unreadCount}}</span>
      </sc-if>
    </button>
  </header>

  <main style="margin-top: -48px; padding: 0 16px 100px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; gap: 16px; align-items: center; box-shadow: 0 6px 20px rgba(18,63,58,0.10)">
      <svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="ชั่วโมงปฏิบัติ 15 จาก 80">
        <circle cx="52" cy="52" r="42" fill="none" stroke="#E2E7E1" stroke-width="10"/>
        <circle cx="52" cy="52" r="42" fill="none" stroke="#1E5B53" stroke-width="10" stroke-linecap="round" stroke-dasharray="49.5 264" transform="rotate(-90 52 52)"/>
        <text x="52" y="52" text-anchor="middle" font-family="Anuphan, sans-serif" font-size="26" font-weight="700" fill="#16231F">15</text>
        <text x="52" y="70" text-anchor="middle" font-family="IBM Plex Sans Thai, sans-serif" font-size="12" fill="#5B6B66">/ 80 ชม.</text>
      </svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #5B6B66">ชั่วโมงปฏิบัติ Small Animal</span>
        <span style="font-family: 'Anuphan', sans-serif; font-size: 17px; font-weight: 600; line-height: 1.35">อีก 65 ชม. ครบเกณฑ์</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div style="background: #F3F5F1; border-radius: 10px; padding: 8px">
            <div style="font-size: 11px; color: #5B6B66">ฝึกภายใน</div>
            <div style="font-weight: 600; font-size: 14px">92 ชม.</div>
          </div>
          <div style="background: #F3F5F1; border-radius: 10px; padding: 8px">
            <div style="font-size: 11px; color: #5B6B66">ฝึกภายนอก</div>
            <div style="font-weight: 600; font-size: 14px">736 ชม.</div>
          </div>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 17px; font-weight: 600">รอบถัดไป</h2>
        <a href="Calendar.dc.html" style="font-size: 13px; font-weight: 500">ดูกิจกรรม</a>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #E2E7E1">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 52px; height: 56px; border-radius: 12px; background: #1E5B53; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center">
            <span style="font-size: 11px">พฤ.</span>
            <span style="font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 700; line-height: 1">15</span>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600; font-size: 15px">เคาน์เตอร์ A เรียกตรวจ (ชั้น 1)</span>
            <span style="font-size: 13px; color: #5B6B66">BI2662510 · 16.30–20.30 · 4 ชม.</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; align-items: center">
            <span style="width: 28px; height: 28px; border-radius: 50%; background: #F7E2B4; border: 2px solid #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">ภ</span>
            <span style="width: 28px; height: 28px; border-radius: 50%; background: #DCEBE5; border: 2px solid #FFFFFF; margin-left: -8px; font-size: 12px; display: flex; align-items: center; justify-content: center">ณ</span>
            <span style="width: 28px; height: 28px; border-radius: 50%; background: #DDE6F2; border: 2px solid #FFFFFF; margin-left: -8px; font-size: 12px; display: flex; align-items: center; justify-content: center">ป</span>
            <span style="font-size: 12px; color: #5B6B66; margin-left: 8px; white-space: nowrap">+ เพื่อน 3 คน</span>
          </div>
          <a href="Log.dc.html" style="height: 40px; padding: 0 16px; border-radius: 999px; background: #1E5B53; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: 0 0 auto">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>เช็กอิน</a>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 17px; font-weight: 600">ต้องทำ</h2>
      <a href="Log.dc.html" style="background: #FFF6E3; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; color: #16231F">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #F2B544; color: #16231F; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">8</span>
        <span style="flex: 1; font-size: 14px">รอบที่ฝึกแล้ว ยังไม่บันทึกทักษะ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a href="Me.dc.html" style="background: #FFFFFF; border: 1px solid #E2E7E1; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; color: #16231F">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #DDE6F2; color: #2F6FA8; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
        </span>
        <span style="flex: 1; font-size: 14px">คำขอแลกรอบ รอพี่ดอร์ทอนุมัติ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 17px; font-weight: 600">เหรียญรางวัล</h2>
        <span style="font-size: 13px; color: #5B6B66">ได้แล้ว {{earnedCount}}/{{badgeCount}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{badges}}" as="b" hint-placeholder-count="5">
          <button onClick="{{b.open}}" aria-label="{{b.aria}}" style="border: 0; background: transparent; padding: 0; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #16231F">
            <span style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center">
              <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; inset: 0">
                <path d="M32 3 38 8.5 46 7.5 49 15 56.5 18 55.5 26 61 32 55.5 38 56.5 46 49 49 46 56.5 38 55.5 32 61 26 55.5 18 56.5 15 49 7.5 46 8.5 38 3 32 8.5 26 7.5 18 15 15 18 7.5 26 8.5z" fill="{{b.rim}}"/>
                <circle cx="32" cy="32" r="21" fill="{{b.face}}" stroke="{{b.ring}}" stroke-width="2"/>
                <circle cx="32" cy="32" r="25" fill="none" stroke="{{b.track}}" stroke-width="3" stroke-dasharray="{{b.dash}}" stroke-linecap="round" transform="rotate(-90 32 32)"/>
              </svg>
              <span style="{{b.iconStyle}}">
                <sc-if value="{{b.isLarge}}" hint-placeholder-val="{{ false }}">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l3-5 2 3h6l2-3 3 5"/><path d="M6 9v6a6 6 0 0 0 12 0V9"/><path d="M10 15h.01M14 15h.01M10 19h4"/></svg>
                </sc-if>
                <sc-if value="{{b.isDay}}" hint-placeholder-val="{{ false }}">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </sc-if>
                <sc-if value="{{b.isSpay}}" hint-placeholder-val="{{ false }}">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5 20 18M8.5 16.5 20 6"/></svg>
                </sc-if>
                <sc-if value="{{b.isFarm}}" hint-placeholder-val="{{ false }}">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6M3 13h18"/></svg>
                </sc-if>
                <sc-if value="{{b.isStreak}}" hint-placeholder-val="{{ false }}">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 3z"/></svg>
                </sc-if>
              </span>
              <sc-if value="{{b.locked}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; right: 0; bottom: 0; min-width: 22px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9D3CC; font-size: 10px; font-weight: 600; color: #3A4A45; display: flex; align-items: center; justify-content: center">{{b.short}}</span>
              </sc-if>
            </span>
            <span style="font-size: 11px; line-height: 1.25; text-align: center; font-weight: 500">{{b.name}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </main>
  </div>

  <nav aria-label="เมนูหลัก" style="position: absolute; left: 0; right: 0; bottom: 0; height: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 5; background: #FFFFFF; border-top: 1px solid #E2E7E1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center; align-items: start; padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #123F3A">
      <span style="width: 56px; height: 30px; color: #1E5B53; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
      </span>หน้าแรก</a>
    <a href="Calendar.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #6B7A75">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </span>กิจกรรม</a>
    <a href="Log.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #6B7A75; margin-top: -24px">
      <span style="width: 56px; height: 56px; border-radius: 50%; box-sizing: border-box; border: 2px solid #1E5B53; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: #1E5B53; box-shadow: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v3H9z"/><path d="M15 4.5h2a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4.5"/></svg>
      </span>บันทึก</a>
    <a href="Book.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #6B7A75">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </span>ลงฝึก</a>
    <a href="Me.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #6B7A75">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </span>ฉัน</a>
  </nav>

  <sc-if value="{{showNotif}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 10; background: rgba(18,35,31,0.55); display: flex; flex-direction: column; justify-content: flex-end">
      <button onClick="{{closeNotif}}" aria-label="ปิด" style="flex: 0 0 88px; border: 0; background: transparent; cursor: pointer"></button>
      <section role="dialog" aria-modal="true" aria-label="การแจ้งเตือน" style="flex: 1; min-height: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
        <div style="padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #EEF1EC">
          <span style="width: 40px; height: 4px; border-radius: 4px; background: #D5DCD6; align-self: center"></span>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <h2 style="margin: 0; font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 700">การแจ้งเตือน</h2>
            <div style="display: flex; align-items: center; gap: 4px">
              <button onClick="{{readAll}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #1E5B53; cursor: pointer">อ่านทั้งหมด</button>
              <button onClick="{{closeNotif}}" aria-label="ปิดการแจ้งเตือน" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #F3F5F1; color: #16231F; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 24px">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
            <h3 style="margin: 0; padding: 14px 16px 6px; font-size: 12px; font-weight: 600; color: #5B6B66">{{g.title}}</h3>
            <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
              <a href="{{n.href}}" style="{{n.row}}">
                <span style="{{n.iconWrap}}">
                  <sc-if value="{{n.isOk}}" hint-placeholder-val="{{ false }}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
                  </sc-if>
                  <sc-if value="{{n.isSwap}}" hint-placeholder-val="{{ false }}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
                  </sc-if>
                  <sc-if value="{{n.isTime}}" hint-placeholder-val="{{ false }}">
