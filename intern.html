yle=\"width: 100%; background: #F3F5F1; border-radius: 14px; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 12px; color: #5B6B66\">นับจากรอบเหล่านี้</span>\n          <sc-for list=\"{{sel.history}}\" as=\"h\" hint-placeholder-count=\"2\">\n            <span style=\"font-size: 13px; display: flex; gap: 8px; align-items: center\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E5B53\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"/></svg>{{h}}</span>\n          </sc-for>\n        </div>\n        <button onClick=\"{{close}}\" style=\"width: 100%; height: 48px; border-radius: 14px; border: 0; background: #1E5B53; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">{{sel.cta}}</button>\n      </section>\n    </div>\n  </sc-if>\n</div>","code":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { open: null };\n  }\n  renderVals() {\n    var self = this;\n    var defs = [\n      { id: 'large', name: 'ราชาสัตว์ใหญ่', rule: 'ฝึกครบทุกหน่วยของสัตว์ใหญ่ (โค กระบือ ม้า แพะ แกะ)', done: 3, goal: 5, unit: 'หน่วย', rim: '#7A4E1F', face: '#B57A35', ring: '#E8C68A', icon: '#FFF4DE', earnedOn: '',\n        history: ['ฟาร์มโคนม · ต.ค. 2569', 'ม้า · ส.ค. 2569', 'แพะ-แกะ · ก.ค. 2569'] },\n      { id: 'day', name: 'ฝึกทั้งวัน', rule: 'ลงฝึกในวันเดียวกันตั้งแต่ 08.30 ถึง 20.30', done: 1, goal: 1, unit: 'วัน', rim: '#B9851B', face: '#F2B544', ring: '#FFE3A3', icon: '#5A3E06', earnedOn: '13 ต.ค. 2569',\n        history: ['13 ต.ค. ศัลยกรรม 08.30–16.30', '13 ต.ค. เคาน์เตอร์ A 16.30–20.30'] },\n      { id: 'spay', name: 'มือทำหมัน', rule: 'ทำหมันในตำแหน่งศัลยแพทย์ครบ 3 รอบ', done: 2, goal: 3, unit: 'รอบ', rim: '#7B2F45', face: '#B5506D', ring: '#F0B8C7', icon: '#FFE9EF', earnedOn: '',\n        history: ['LAB-SP02 · สุนัขเพศเมีย', 'LAB-SP03 · แมวเพศผู้'] },\n      { id: 'farm', name: 'ปศุสัตว์', rule: 'ฝึกงานปศุสัตว์ครบตามเกณฑ์ (สุกร สัตว์ปีก โค)', done: 3, goal: 3, unit: 'ประเภท', rim: '#1A4A43', face: '#1E5B53', ring: '#7FBFB2', icon: '#E6F4EF', earnedOn: '30 ก.ย. 2569',\n        history: ['ฟาร์มสุกร · ก.ย. 2569', 'ฟาร์มไก่ไข่ · ส.ค. 2569', 'ฟาร์มโคนม · ก.ค. 2569'] },\n      { id: 'streak', name: '3 วันติด', rule: 'ลงฝึกงานโรงพยาบาลติดต่อกัน 3 วัน', done: 3, goal: 3, unit: 'วัน', rim: '#9C3A12', face: '#D9692B', ring: '#F7C3A0', icon: '#FFF0E6', earnedOn: '8 ต.ค. 2569',\n        history: ['6 ต.ค. อายุรกรรม', '7 ต.ค. vaccine', '8 ต.ค. เคาน์เตอร์ A'] }\n    ];\n    var circ = 2 * Math.PI * 25;\n    function build(d) {\n      var earned = d.done >= d.goal;\n      var pct = Math.min(1, d.done / d.goal);\n      return {\n        id: d.id, name: d.name, rule: d.rule, history: d.history,\n        isLarge: d.id === 'large', isDay: d.id === 'day', isSpay: d.id === 'spay', isFarm: d.id === 'farm', isStreak: d.id === 'streak',\n        locked: !earned,\n        short: d.done + '/' + d.goal,\n        rim: earned ? d.rim : '#C9D3CC',\n        face: earned ? d.face : '#EEF1EC',\n        ring: earned ? d.ring : '#DDE3DE',\n        track: earned ? d.ring : d.face,\n        dash: earned ? '0 200' : (pct * circ).toFixed(1) + ' 200',\n        iconStyle: 'position: relative; display: flex; color: ' + (earned ? d.icon : '#7C8B86'),\n        bigIcon: 'position: relative; display: flex; color: ' + (earned ? d.icon : '#7C8B86'),\n        aria: d.name + (earned ? ' ได้แล้ว' : ' ' + d.done + ' จาก ' + d.goal),\n        status: earned ? 'ได้รับเมื่อ ' + d.earnedOn : 'อีก ' + (d.goal - d.done) + ' ' + d.unit,\n        statusStyle: 'font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; ' + (earned ? 'background: #FFF6E3; color: #6B4A10' : 'background: #F3F5F1; color: #3A4A45'),\n        progress: d.done + ' / ' + d.goal + ' ' + d.unit,\n        barStyle: 'height: 100%; width: '       ['17.00', '20.30', 'อายุรกรรม OPD']\n    ];\n    function itemsFor(day) {\n      return T.map(function (t, i) {\n        var cap = (i % 3 === 0) ? 2 : 1;\n        var taken = (day * 5 + i * 3) % 4 === 0 ? cap : ((day + i) % 3 === 0 ? Math.max(0, cap - 1) : 0);\n        var code = 'BI2663' + String(100 + day * 10 + i).slice(-3);\n        return { i: i, key: day + '-' + i, s: t2h(t[0]), e: t2h(t[1]), from: t[0], to: t[1], unit: t[2], cap: cap, taken: taken, code: code };\n      });\n    }\n    var booked = this.state.booked;\n    var day = this.state.day;\n    var thShort = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];\n\n    var days = [];\n    for (var d = 1; d <= 30; d++) {\n      (function (dd) {\n        var list = itemsFor(dd);\n        var mine = list.some(function (x) { return booked[x.key]; });\n        var open = list.some(function (x) { return x.taken < x.cap; });\n        var on = dd === day;\n        var weekend = (dd - 1) % 7 === 0 || (dd - 1) % 7 === 6;\n        days.push({\n          n: String(dd), on: on ? 'true' : 'false',\n          label: dd + ' พฤศจิกายน' + (mine ? ' ลงแล้ว' : '') + (open ? ' มีที่ว่าง' : ' เต็ม'),\n          style: 'height: 42px; border-radius: 10px; font-family: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; '\n            + (on ? 'border: 0; background: #1E5B53; color: #FFFFFF; font-weight: 600' : (mine ? 'border: 1.5px solid #1E5B53; background: #DCEBE5; color: #123F3A; font-weight: 600' : 'border: 0; background: transparent; color: ' + (weekend ? '#7C8B86' : '#16231F'))),\n          dot: 'width: 5px; height: 5px; border-radius: 50%; background: ' + (on ? (open ? '#7EE0A1' : '#9AAAA4') : (open ? '#2E9E5B' : '#C9D3CC')),\n          pick: function () { self.setState({ day: dd }); }\n        });\n      })(d);\n    }\n\n    var winDefs = [{ id: 'all', label: 'ทั้งหมด', a: 0, b: 24 }, { id: 'am', label: 'เช้า', a: 8, b: 12 }, { id: 'pm', label: 'บ่าย', a: 12.5, b: 16.5 }, { id: 'eve', label: 'เย็น', a: 16.5, b: 21 }];\n    var win = winDefs.filter(function (w) { return w.id === self.state.win; })[0];\n    var chipStyle = function (on) { return 'height: 34px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; ' + (on ? 'border: 0; background: #1E5B53; color: #FFFFFF; font-weight: 600' : 'border: 1px solid #E2E7E1; background: #FFFFFF; color: #16231F'); };\n    var chips = winDefs.map(function (w) {\n      var on = w.id === self.state.win;\n      return { label: w.label, on: on ? 'true' : 'false', style: chipStyle(on), pick: function () { self.setState({ win: w.id }); } };\n    });\n    chips.push({ label: 'ซ่อนที่เต็ม', on: self.state.hideFull ? 'true' : 'false', style: chipStyle(self.state.hideFull), pick: function () { self.setState({ hideFull: !self.state.hideFull }); } });\n\n    var list = itemsFor(day);\n    var mineToday = list.filter(function (x) { return booked[x.key]; });\n    var openCount = 0;\n    var groups = {};\n    var order = [];\n    list.forEach(function (x) {\n      if (!(x.s < win.b && x.e > win.a)) return;\n      var mine = !!booked[x.key];\n      var full = x.taken >= x.cap && !mine;\n      if (self.state.hideFull && full) return;\n      var clash = !mine && mineToday.some(function (m) { return m.s < x.e && x.s < m.e; });\n      if (!full && !clash && !mine) openCount++;\n      var g = x.from + '–' + x.to;\n      if (!groups[g]) { groups[g] = { time: g, hrs: String(x.e - x.s).replace('.5', '.5'), items: [] }; order.push(g); }\n      var left = x.cap - x.taken;\n      var label, btn;\n      var base = 'min-width: 76px; height: 40px; padding: 0 12px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; flex: 0 0 auto; ';\n      if (mine) { label = 'ลงแล้ว'; btn = base + 'border: 0; background: #DCEBE5; color: #123F3A'; }\n      else if (full) { label = 'เต็ม'; btn = base + 'border: 1px solid #E2E7E1; background: #F3F5F1; color: #7C8B86; cursor: default'; }\n      else if (clash) { label = 'ชนเวลา'; btn = base + 'border: 1px solid #E2E7E1; background: #FFFFFF; color: #7C8B86; cursor: default'; }\n      else { label = 'ลง'; btn = base + 'border: 0; background: #1E5B53; color: #FFFFFF'; }\n      groups[g].items.push({\n        unit: x.unit, code: x.code,\n        seats: mine ? 'ที่ของคุณ' : (full ? 'เต็ม ' + x.cap + '/' + x.cap : 'ว่าง ' + left + '/' + x.cap),\n        seatStyle: mine ? 'color: #1E5B53; font-weight: 600' : (full ? 'color: #7C8B86' : 'color: #2E7A4C; font-weight: 600'),\n        row: 'display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #EEF1EC; ' + (mine ? 'background: #F2F8F5' : '') + ((full || clash) ? 'opacity: 0.75' : ''),\n        btnLabel: label, btn: btn,\n        aria: label + ' ' + x.unit + ' ' + g,\n        tap: function () {\n          if (full || clash) return;\n          var next = Object.assign({}, self.state.booked);\n          if (mine) { delete next[x.key]; self.setState({ booked: next, last: null }); }\n          else { next[x.key] = true; self.setState({ booked: next, last: { key: x.key, code: x.code } }); }\n        }\n      });\n    });\n    var slots = order.map(function (k) { var g = groups[k]; g.hrs = (Math.round((list.filter(function (x) { return x.from + '–' + x.to === k; })[0].e - list.filter(function (x) { return x.from + '–' + x.to === k; })[0].s) * 10) / 10).toString(); return g; });\n\n    var count = 0, hours = 0;\n    Object.keys(booked).forEach(function (k) {\n      if (!booked[k]) return;\n      var p = k.split('-');\n      var x = itemsFor(Number(p[0]))[Number(p[1])];\n      count++; hours += x.e - x.s;\n    });\n    var last = this.state.last;\n\n    var partners = [\n      { name: 'ฟาร์มโคนม [ชื่อฟาร์ม]', place: 'อ.มวกเหล็ก จ.สระบุรี · โคนม', visits: 12, tags: ['มีที่พัก', 'รถตู้จากคณะ', 'โคนม 200 ตัว'], review: 'ตื่นตี 4 รีดนม มีพี่สัตวแพทย์สอนตลอด' },\n      { name: 'ฟาร์มโคเนื้อ [ชื่อฟาร์ม]', place: 'อ.ปากช่อง จ.นครราชสีมา · โคเนื้อ', visits: 5, tags: ['มีที่พัก', 'เดินทางเอง'], review: 'ได้ทำ rectal palpation เยอะ' }\n    ];\n    return {\n      tabs: tabs, isIn: tab === 'in', isOut: tab === 'out', isTrip: tab === 'trip',\n      days: days, chips: chips, slots: slots, empty: slots.length === 0, openCount: openCount,\n      dayTitle: thShort[(day - 1) % 7] + ' ' + day + ' พ.ย.',\n      count: count, hours: Math.round(hours * 10) / 10,\n      hasToast: !!last, noToast: !last,\n      toast: last ? 'ลงแล้ว ' + last.code : '',\n      undo: function () {\n        if (!last) return;\n        var next = Object.assign({}, self.state.booked);\n        delete next[last.key];\n        self.setState({ booked: next, last: null });\n      },\n      partners: partners\n    };\n  }\n}\n","props":{}},"Log.dc.html":{"label":"บันทึกทักษะ","tpl":"<div style=\"width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F5F1; font-family: 'IBM Plex Sans Thai', sans-serif; color: #16231F; box-sizing: border-box\">\n  <header style=\"padding: 20px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E7E1; display: flex; flex-direction: column; gap: 12px\">\n    <h1 style=\"margin: 0; font-family: 'Anuphan', sans-serif; font-size: 24px; font-weight: 700\">บันทึกทักษะ</h1>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n      <button style=\"height: 48px; border-radius: 12px; border: 0; background: #1E5B53; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3\"/><rect x=\"8\" y=\"8\" width=\"8\" height=\"8\" rx=\"1\"/></svg>สแกน QR หน่วย</button>\n      <a href=\"Lab.dc.html\" style=\"height: 48px; border-radius: 12px; border: 1.5px solid #1E5B53; background: #FFFFFF; color: #1E5B53; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/></svg>รหัสแลป</a>\n    </div>\n  </header>\n\n  <main style=\"height: 718px; overflow-y: auto; box-sizing: border-box; padding: 14px 16px 170px; display: flex; flex-direction: column; gap: 14px\">\n    <section style=\"display: flex; flex-direction: column; gap: 8px\">\n      <h2 style=\"margin: 0; font-size: 14px; font-weight: 600\">ฝึกแล้ว ยังไม่บันทึก · 8 รอบ</h2>\n      <div style=\"display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px\">\n        <sc-for list=\"{{rounds}}\" as=\"r\" hint-placeholder-count=\"3\">\n          <button onClick=\"{{r.pick}}\" style=\"{{r.style}}\">\n            <span style=\"font-size: 12px\">{{r.date}}</span>\n            <span style=\"font-size: 13px; font-weight: 600\">{{r.short}}</span>\n          </button>\n        </sc-for>\n      </div>\n    </section>\n\n    <section style=\"background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E7E1; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center\">\n        <span style=\"font-weight: 600; font-size: 15px\">{{cur.unit}}</span>\n        <span style=\"font-size: 11px; font-weight: 600; color: #123F3A; background: #DCEBE5; border-radius: 999px; padding: 3px 8px; white-space: nowrap\">เติมอัตโนมัติ</span>\n      </div>\n      <div style=\"display: grid; grid-template-column a.pick}}\" aria-pressed=\"{{a.on}}\" style=\"{{a.style}}\">{{a.label}}</button>\n        </sc-for>\n      </div>\n    </section>\n\n    <section style=\"display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n        <h2 style=\"margin: 0; font-size: 14px; font-weight: 600\">3. ทักษะที่ได้ (เลือกให้อัตโนมัติ)</h2>\n        <span style=\"font-size: 12px; color: #5B6B66\">{{skillCount}} ทักษะ</span>\n      </div>\n      <div style=\"background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E7E1; padding: 6px 14px\">\n        <sc-for list=\"{{skills}}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: center; gap: 10px; min-height: 42px; border-bottom: 1px solid #EEF1EC\">\n            <span style=\"width: 22px; height: 22px; border-radius: 50%; background: #DCEBE5; display: flex; align-items: center; justify-content: center; flex: 0 0 auto\">\n              <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E5B53\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-10\"/></svg>\n            </span>\n            <span style=\"font-size: 14px\">{{s}}</span>\n          </div>\n        </sc-for>\n      </div>\n    </section>\n\n    <section style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <h2 style=\"margin: 0; font-size: 14px; font-weight: 600\">4. Feedback แลปนี้ <span style=\"font-weight: 400; color: #5B6B66\">(ไม่บังคับ)</span></h2>\n        <span style=\"font-size: 12px; color: #5B6B66\">ส่งถึงอาจารย์ผู้รับผิดชอบแลป</span>\n      </div>\n      <label style=\"display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-size: 13px; font-weight: 500\">ปัญหาที่พบ</span>\n        <textarea rows=\"3\" placeholder=\"เช่น อุปกรณ์ไม่พอ ยาสลบออกฤทธิ
