<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VETRES | Who's using?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kanit:wght@200;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* สีพื้นหลังเป๊ะๆ จาก Disney+ */
            --disney-bg: #0f111a;
            --disney-text: #f9f9f9;
            --disney-gray: #a8a9ad;
        }

        body { 
            font-family: 'Inter', 'Kanit', sans-serif; 
            background-color: var(--disney-bg);
            color: var(--disney-text); 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ────────────────────────────────────────
           TOP NAVIGATION (DISNEY STYLE)
           ──────────────────────────────────────── */
        .brand-logo {
            position: fixed;
            top: 2.5rem;
            left: 3rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            cursor: pointer;
        }
        .brand-logo span { font-weight: 300; opacity: 0.7; }

        /* ────────────────────────────────────────
           MAIN CONTENT
           ──────────────────────────────────────── */
        .who-is-using {
            font-size: 2.75rem; /* ขนาดฟอนต์เป๊ะๆ */
            font-weight: 700;
            margin-bottom: 4rem;
            letter-spacing: -0.01em;
        }

        .profile-group {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            align-items: flex-start;
        }

        .role-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 160px;
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* เอฟเฟกต์ขยายไอคอนแบบ Disney+ */
        .icon-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            border: 4px solid transparent;
        }

        .role-item:hover .icon-circle {
            transform: scale(1.1);
            border-color: #f9f9f9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .role-label {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--disney-gray);
            transition: color 0.3s;
        }

        .role-item:hover .role-label {
            color: #ffffff;
        }

        /* ────────────────────────────────────────
           PIN & MODAL OVERLAY
           ──────────────────────────────────────── */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.4) !important; /* มืดลงแค่ 40% */
            backdrop-filter: blur(15px) !important; /* เบลอพื้นหลัง */
            -webkit-backdrop-filter: blur(15px) !important;
        }
        .btn-close-top {
            position: absolute;
            top: 2.5rem;
            left: 3rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.5rem;
            transition: all 0.2s;
            z-index: 60;
        }
        .btn-close-top:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .pin-dot {
            width: 14px; height: 14px;
            border: 2px solid #555;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .pin-dot.active {
            background: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px #fff;
        }


        .numpad-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 500;
            color: #f9f9f9;
            transition: all 0.2s;
            margin: 0 auto; /* จัดกลางในช่อง grid */
        }
        .numpad-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
        }

        .numpad-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.2);
        }
        /* เอฟเฟกต์เขย่าเมื่อรหัสผิด */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        /* ข้อความแจ้งเตือนด้านล่างจุด PIN */
        #pinErrorMessage {
            color: #ff453a; /* สีแดงสไตล์ iOS */
            font-size: 0.85rem;
            margin-top: 1.5rem;
            height: 1.5rem; /* จองพื้นที่ไว้เพื่อไม่ให้ UI กระโดด */
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .show-error { opacity: 1 !important; }
        /* หัวข้อ: ปรับขนาดลงให้ดูแพง ไม่ตะโกน */
        .station-header {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.25em; /* เพิ่มระยะห่างให้ดูหรู */
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 3rem;
        }

        /* ปุ่มแบบ Compact Tile: ลด Padding และความหนาลง */
        .station-option {
            position: relative;
            padding: 1.25rem 0.5rem; /* ลดจาก 2.5rem เหลือครึ่งเดียว */
            font-size: 1.1rem; /* ขนาดฟอนต์กำลังดี ไม่ใหญ่เกินหน้าแรก */
            font-weight: 400;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03); /* จางลงอีกเพื่อให้ดูเบา */
            border: 1px solid rgba(255, 255, 255, 0.05); /* เส้นขอบบางมาก */
            border-radius: 12px; /* มุมโค้งเล็กลงให้ดู Sharp */
            transition: all 0.2s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* แตะแล้วให้แค่เข้มขึ้นและยุบตัวจางๆ */
        .station-option:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ปรับ Modal Container ให้ดูกระชับ ไม่บานเต็มจอเกินไป */
        #stationCard {
            max-width: 800px;
            width: 85%;
            padding: 1rem;
        }
        /* สไตล์หน้าจอเมื่อถูกล็อค */
        .system-locked-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(40px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    </main>

    <section id="pinSection" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center" onclick="handleOutsideClick(event, 'pin')">
        <button onclick="closePinModal()" class="btn-close-top">
            <i class="fas fa-times"></i>
        </button>

        <div id="pinCard" class="w-full max-w-[320px] flex flex-col items-center">

            <div class="flex flex-col items-center">

                    <div class="pin-dot" id="dot1"></div>
                    <div class="pin-dot" id="dot2"></div>
                    <div class="pin-dot" id="dot3"></div>
                    <div class="pin-dot" id="dot4"></div>

                <button onclick="pressKey('5')" class="numpad-btn">5</button>
                <button onclick="pressKey('6')" class="numpad-btn">6</button>

                <button onclick="pressKey('clear')" class="text-[10px] uppercase tracking-widest text-zinc-500 hover:text-white transition-colors">Clear</button>

    <div id="stationModal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4" onclick="handleOutsideClick(event, 'station')">
        <button onclick="closeStationModal()" class="btn-close-top"><i class="fas fa-times"></i></button>
        
        <div id="stationCard" class="w-full max-w-4xl text-center">
            <header class="mb-12">
                <h2 class="text-3xl font-bold text-white tracking-tight uppercase">Select Station</h2>
                <p class="text-zinc-500 text-sm mt-2 font-light">Please select your work station</p>
            </header>
            <div id="stationGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        // ข้อมูลนี้หาได้จาก Supabase Project Settings > API
        const SUPABASE_URL = 'https://xjosswxrtcanhvpdbrap.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqb3Nzd3hydGNhbmh2cGRicmFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MjkyODcsImV4cCI6MjA5MjUwNTI4N30.DrtoBXmdL1EN17sVYZIYNVVOOp7UHfeAz1sDImZmYFM';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const PINS = { admin: "1111", staff: "2222" };
        const STATIONS = ['โรบินฮู้ด', 'หมูกระทะ', 'ไก่ไวน์', 'ส้มตำ', 'กระต่าย', 'ต้มยำ', 'คอหมูย่าง', 'บาร์บีคิว', 'ไข่เจียว', 'ข้าว', 'น้ำ', 'โอ้เอ๋ว'];
        
        let currentRole = "";
        let currentPinInput = "";

        function selectProfile(role) {
            currentRole = role;
            currentPinInput = "";
            
            // ตั้งหัวข้อหน้า PIN ให้ตรงตามตำแหน่ง
            const titleMap = {
                admin: "ผู้จัดการระบบ",
                staff: "พนักงานบริการ",
                kitchen: "แผนกครัว",
                dashboard: "ระบบสถิติร้าน"
            };

            document.getElementById('pinTitle').innerHTML = `
                <p class="text-zinc-500 text-[13px] uppercase mb-2 font-medium">กรอกรหัสผ่านสำหรับ</p>
                <h2 class="text-2xl font-bold text-white uppercase tracking-wide">${titleMap[role]}</h2>
            `;
            
            resetPinDots();
            document.getElementById('profileSection').classList.add('hidden');
            document.getElementById('pinSection').classList.remove('hidden');
        }

        function closePinModal() {
            document.getElementById('pinSection').classList.add('hidden');
            document.getElementById('profileSection').classList.remove('hidden');
        }

        function pressKey(key) {
            if (key === 'clear') currentPinInput = "";
            else if (key === 'backspace') currentPinInput = currentPinInput.slice(0, -1);
            else if (currentPinInput.length < 4) currentPinInput += key;
            updatePinDots();
            if (currentPinInput.length === 4) setTimeout(checkPin, 200);
        }

        function updatePinDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i <= currentPinInput.length) dot.classList.add('active');
                else dot.classList.remove('active');
            }
        }

        function resetPinDots() {
            for (let i = 1; i <= 4; i++) document.getElementById(`dot${i}`).classList.remove('active');
        }

        // ตั้งค่าความปลอดภัย
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 5 * 60 * 1000; // 5 นาที (มิลลิวินาที)

       async function checkPin() {
            const hashedInput = CryptoJS.SHA256(currentPinInput).toString();
            const dotContainer = document.getElementById('pinDotContainer');
            const errorMsg = document.getElementById('pinErrorMessage');
        
            try {
                const { data, error } = await supabaseClient.rpc('verify_staff_access', {
                    input_role: currentRole,
                    input_hash: hashedInput
                });
        
                if (data.success) {
                    // สำเร็จ: ล้าง Error และไปหน้าถัดไป
                    errorMsg.classList.remove('show-error');
                    window.location.href = `${currentRole}.html`;
                } else {
                    // ไม่สำเร็จ: ใส่เอฟเฟกต์ Apple Shake
                    dotContainer.classList.add('shake');
                    
                    // แสดงข้อความแจ้งเตือน
                    if (data.is_locked) {
                        errorMsg.innerText = "ระบบถูกล็อคชั่วคราว กรุณารอสักครู่";
                    } else {
                        errorMsg.innerText = `รหัสไม่ถูกต้อง (เหลืออีก ${data.attempts_left} ครั้ง)`;
                    }
                    errorMsg.classList.add('show-error');
        
                    // ล้างค่าหลังจากเขย่าเสร็จ
                    setTimeout(() => {
                        dotContainer.classList.remove('shake');
                        currentPinInput = "";
                        resetPinDots();
                    }, 400);
                }
            } catch (err) {
                errorMsg.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
                errorMsg.classList.add('show-error');
            }
        }

        function handleFailedAttempt() {
            let attempts = parseInt(localStorage.getItem('vetres_failed_attempts') || "0");
            attempts++;
            localStorage.setItem('vetres_failed_attempts', attempts);

            if (attempts >= MAX_ATTEMPTS) {
                const lockoutTime = Date.now() + LOCKOUT_TIME;
                localStorage.setItem('vetres_lockout_until', lockoutTime);
                alert("คุณกรอกรหัสผิดเกินกำหนด! ระบบถูกล็อคเป็นเวลา 5 นาที");
            } else {
                alert(`รหัสผ่านไม่ถูกต้อง (เหลือโอกาสอีก ${MAX_ATTEMPTS - attempts} ครั้ง)`);
            }
            
            currentPinInput = "";
            resetPinDots();
        }

        // ฟังก์ชันตัวอย่างการเรียกฐานข้อมูล (Concept)
        async function validatePinWithBackend(role, pin) {
            // ในขั้นตอนใช้งานจริง คุณควรใช้ Supabase/Firebase 
            // เพื่อตรวจสอบ PIN ที่ผ่านการ Hash มาแล้ว
            return pin === "1111"; // ตัวอย่างชั่วคราว
        }

        function openStationModal() {
            const grid = document.getElementById('stationGrid');
            const headerContainer = document.querySelector('#stationCard header');
            
            headerContainer.innerHTML = `<h2 class="station-header uppercase">เลือกซุ้มของคุณ</h2>`;
            
            grid.innerHTML = "";
            grid.className = "grid grid-cols-2 md:grid-cols-4 gap-4";

            STATIONS.forEach(s => {
                const btn = document.createElement('button');
                btn.className = "station-option";
                btn.innerText = s;
                
                btn.onclick = (e) => { 
                    e.stopPropagation();
                    
                    // 1. ออกตั๋ว (Session) สำหรับ Kitchen
                    const sessionData = {
                        role: 'kitchen',
                        timestamp: Date.now()
                    };
                    sessionStorage.setItem('vetres_session', JSON.stringify(sessionData));
                
                    // 2. เก็บชื่อซุ้มลง LocalStorage
                    localStorage.setItem('kds_station', s); 
                    
                    // 3. ย้ายหน้า
                    window.location.href = 'kds.html'; 
                };
                
                // --- ต้องเพิ่มบรรทัดนี้เพื่อให้ปุ่มไปโผล่ในหน้าจอ ---
                grid.appendChild(btn); 
            }); // <--- ปิด forEach ตรงนี้

            document.getElementById('stationModal').classList.remove('hidden');
        } // <--- ปิด function ตรงนี้

        function handleOutsideClick(event, type) {
            // เช็คว่าจุดที่คลิกคือ "ตัวพื้นหลัง" (overlay) ไม่ใช่ "ตัวการ์ด" (card)
            const cardId = type === 'pin' ? 'pinCard' : 'stationCard';
            const card = document.getElementById(cardId);
            
            if (!card.contains(event.target)) {
                if (type === 'pin') closePinModal();
                else closeStationModal();
            }
        }

        function closeStationModal() { document.getElementById('stationModal').classList.add('hidden'); }
    </script>
    
</body>
</html>
