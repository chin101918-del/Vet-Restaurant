<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheese Thief - Sync</title>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; color: #333; padding: 20px; border-radius: 15px; margin: 10px; width: 80%; max-width: 300px; text-align: center; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; background: #e74c3c; color: white; cursor: pointer; margin: 5px; font-size: 16px; }
        .input-box { margin-bottom: 20px; text-align: center; }
        input { padding: 10px; border-radius: 5px; border: none; font-size: 16px; text-align: center; width: 200px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { background: white; color: #333; padding: 30px; border-radius: 20px; text-align: center; width: 80%; max-width: 300px; }
    </style>
</head>
<body>

    <h1>Cheese Thief 🧀</h1>
    <div class="input-box" id="setupArea">
        <label>รหัสห้อง:</label><br>
        <input type="text" id="roomCode" placeholder="เช่น 1234">
        <br>
        <button class="btn" onclick="initGame()">เริ่มเกม</button>
    </div>

    <div id="gameArea" style="display:none;">
        <p>แตะชื่อเพื่อเปิดดูบทบาทหรือเลขเต๋า</p>
        <div id="playerList"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="playerName">ชื่อ</h2>
            <div id="roleDisplay" style="margin: 15px 0; font-size: 1.2em;"></div>
            <div id="diceDisplay" style="margin: 15px 0; font-size: 1.2em;"></div>
            <button class="btn" onclick="closeModal()">ปิด</button>
        </div>
    </div>

    <script>
        const playersData = ["ชิน", "ดาวาว", "เจนนี่", "แนด", "โบ๊ท", "เหนือ", "กิ่งไผ่", "บอส", "เป้", "ซอ"];
        let game = [];

        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function initGame() {
            const code = document.getElementById('roomCode').value;
            if (!code) { alert("กรุณาใส่รหัสห้อง"); return; }

            let seed = 0;
            for(let i=0; i<code.length; i++) seed += code.charCodeAt(i);

            // 1. สุ่มบทบาท
            let roles = Array(playersData.length).fill("หนูบ้าน");
            let thiefIndex = Math.floor(seededRandom(seed++) * playersData.length);
            roles[thiefIndex] = "หนูชีส 🧀";

            // 2. สุ่มเลขเต๋า (1-6) สำหรับทุกคน
            let diceValues = playersData.map(() => Math.floor(seededRandom(seed++) * 6) + 1);

            // เก็บข้อมูล
            game = playersData.map((name, i) => ({ 
                name, 
                role: roles[i], 
                dice: diceValues[i] 
            }));
            
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            
            const list = document.getElementById('playerList');
            list.innerHTML = '';
            game.forEach((p, i) => {
                let div = document.createElement('div');
                div.className = 'card';
                div.innerText = p.name;
                div.onclick = () => openModal(p);
                list.appendChild(div);
            });
        }

        function openModal(player) {
            document.getElementById('playerName').innerText = player.name;
            
            // สร้างปุ่มดู Role
            document.getElementById('roleDisplay').innerHTML = `<button class="btn" style="background:#3498db" onclick="this.parentElement.innerHTML='<b>บทบาท:</b> ${player.role}'">เปิดบทบาท</button>`;
            
            // สร้างปุ่มดู Dice
            document.getElementById('diceDisplay').innerHTML = `<button class="btn" style="background:#9b59b6" onclick="this.parentElement.innerHTML='<b>เลขเต๋า:</b> ${player.dice}'">เปิดเลขเต๋า</button>`;
            
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
