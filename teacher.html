<style>
*,*::before,*::after{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#F3F5F1}
body{font-family:'IBM Plex Sans Thai',sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:#1E5B53;text-decoration:none}a:hover{color:#123F3A}
/* phone: the app is exactly the visible screen */
#stage{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#F3F5F1}
.screen{width:100%;height:100%}
.screen [style*="overflow-y: auto"],.screen [style*="overflow-x: auto"]{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.screen ::-webkit-scrollbar{display:none}
.screen [style*="overflow-y: auto"] > *{flex-shrink:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #F2B544;outline-offset:2px}
/* stop iOS zooming in when a field is focused */
@media (hover:none) and (pointer:coarse){input,textarea{font-size:16px !important}}
/* small phones (≤360px): tighten a little so nothing overflows */
@media (max-width:360px){.screen{font-size:14px}.screen h1{font-size:21px !important}.screen header button,.screen header a{font-size:13px !important}}
/* desktop / tablet: show it inside a phone frame */
@media (min-width:600px){
  html,body{background:#DDE3DE}
  #stage{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:390px;height:min(844px,calc(100vh - 40px));border-radius:36px;box-shadow:0 24px 60px rgba(18,35,31,.25)}
}
</style>
</head>
<body>
<div id="stage"></div>

<template id="tpl-Main">
<div style="width: 100%; height: 100%; position: relative; overflow: hidden; background: #F3F5F1; font-family: 'IBM Plex Sans Thai', sans-serif; color: #16231F; box-sizing: border-box; display: flex; flex-direction: column">
  <header style="padding: 20px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E7E1; display: flex; flex-direction: column; gap: 12px; flex: 0 0 auto">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Profile.dc.html" aria-label="โปรไฟล์ อ.ธนา" style="width: 44px; height: 44px; border-radius: 50%; background: #123F3A; color: #FFFFFF; font-family: 'Anuphan', sans-serif; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">ธ</a>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="font-family: 'Anuphan', sans-serif; font-size: 20px; font-weight: 700">สวัสดี อ.ธนา</span>
        <span style="font-size: 12px; color: #5B6B66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">อายุรกรรมสัตว์เล็ก · พฤหัสบดี 15 ต.ค.</span>
      </span>
      <button aria-label="การแจ้งเตือน" style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E2E7E1; background: #FFFFFF; color: #16231F; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: #C2410C; border: 2px solid #FFFFFF"></span>
      </button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <section style="flex-shrink: 0; background: #1E5B53; color: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 13px; color: #CFE3DC">รอคุณประเมิน</span>
      <span style="font-family: 'Anuphan', sans-serif; font-size: 22px; font-weight: 700">{{pendingCount}} รายการ · {{skillCount}} ทักษะ</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px">
          <span style="font-family: 'Anuphan', sans-serif; font-size: 18px; font-weight: 700; color: #F2B544">{{urgentCount}}</span>
          <span style="font-size: 12px; color: #CFE3DC">อนุมัติอัตโนมัติใน 2 วัน</span>
        </div>
        <div style="background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px">
          <span style="font-family: 'Anuphan', sans-serif; font-size: 18px; font-weight: 700">1.4 วัน</span>
          <span style="font-size: 12px; color: #CFE3DC">เวลาตอบเฉลี่ยของคุณ</span>
        </div>
      </div>
      <span style="font-size: 12px; color: #CFE3DC">ถ้าไม่ประเมินภายใน 7 วันหลังนิสิตส่ง ระบบจะอนุมัติให้อัตโนมัติ (ไม่มีคะแนน)</span>
    </section>

    <div role="tablist" style="flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{items}}" as="s" hint-placeholder-count="4">
      <article style="flex-shrink: 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E7E1; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #DCEBE5; color: #123F3A; font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">{{s.initial}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{s.name}}</span>
