<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Simple App</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
        .card { background: white; color: #333; padding: 30px; border-radius: 15px; margin: 20px auto; max-width: 300px; min-height: 150px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        button { padding: 15px 25px; font-size: 16px; border-radius: 10px; border: none; background: #e74c3c; color: white; cursor: pointer; margin-top: 10px; width: 100%; max-width: 300px; }
        .btn-mod { background: #3498db; }
        textarea { width: 100%; max-width: 300px; height: 120px; padding: 10px; border-radius: 8px; }
        #gameArea, #finalArea, #moderatorList { display: none; }
        .role-list { text-align: left; margin: 20px auto; max-width: 300px; background: #333; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="setupArea">
        <h1>Werewolf Setup</h1>
        <p>ใส่ชื่อผู้เล่น (บรรทัดละชื่อ, ขั้นต่ำ 4 คน)</p>
        <textarea id="playerInput">ผู้เล่น A&#10;ผู้เล่น B&#10;ผู้เล่น C&#10;ผู้เล่น D</textarea>
        <button onclick="startGame()">เริ่มแจกบทบาท</button>
    </div>

    <div id="gameArea">
        <h2 id="turnLabel">ส่งมือถือให้...</h2>
        <div class="card" id="card" onclick="flipCard()">แตะเพื่อดูบทบาท</div>
        <button id="nextBtn" onclick="nextPlayer()" style="display:none;">คนถัดไป</button>
    </div>

    <div id="finalArea">
        <h2>แจกครบแล้ว!</h2>
        <button class="btn-mod" onclick="showModeratorView()">ตรวจสอบบทบาททั้งหมด</button>
    </div>

    <div id="moderatorList">
        <h2>รายชื่อและบทบาท</h2>
        <div id="listContent" class="role-list"></div>
        <button onclick="location.reload()">เริ่มใหม่</button>
    </div>

    <script>
        let players = [];
        let currentIndex = 0;
        let isFlipped = false;

        function startGame() {
            let names = document.getElementById('playerInput').value.split('\n').filter(n => n.trim() !== '');
            if(names.length < 4) { alert("ต้องมีอย่างน้อย 4 คนครับ"); return; }
            
            // กำหนดบทบาท
            let roles = ["หมาป่า (Werewolf)", "ผู้หยั่งรู้ (Seer)", "บอดี้การ์ด (Bodyguard)"];
            while(roles.length < names.length) roles.push("ชาวบ้าน (Villager)");
            
            // สุ่มลำดับ
            roles = roles.sort(() => Math.random() - 0.5);
            names = names.sort(() => Math.random() - 0.5);
            
            // จับคู่
            players = names.map((name, i) => ({ name: name, role: roles[i] }));
            
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            updateTurn();
        }

        function updateTurn() {
            isFlipped = false;
            document.getElementById('turnLabel').innerText = "ส่งมือถือให้: " + players[currentIndex].name;
            document.getElementById('card').innerText = "แตะเพื่อดูบทบาท";
            document.getElementById('card').style.background = "white";
            document.getElementById('nextBtn').style.display = "none";
        }

        function flipCard() {
            if(!isFlipped) {
                document.getElementById('card').innerText = players[currentIndex].role;
                // เปลี่ยนสีการ์ดตามบทบาท
                if(players[currentIndex].role.includes("หมาป่า")) document.getElementById('card').style.background = "#e74c3c";
                else document.getElementById('card').style.background = "#2ecc71";
                
                isFlipped = true;
                document.getElementById('nextBtn').style.display = "inline-block";
            }
        }

        function nextPlayer() {
            currentIndex++;
            if(currentIndex >= players.length) {
                document.getElementById('gameArea').style.display = 'none';
                document.getElementById('finalArea').style.display = 'block';
            } else {
                updateTurn();
            }
        }

        function showModeratorView() {
            document.getElementById('finalArea').style.display = 'none';
            document.getElementById('moderatorList').style.display = 'block';
            
            let html = "<ul>";
            players.forEach(p => {
                html += `<li><b>${p.name}</b>: ${p.role}</li>`;
            });
            html += "</ul>";
            document.getElementById('listContent').innerHTML = html;
        }
    </script>
</body>
</html>
